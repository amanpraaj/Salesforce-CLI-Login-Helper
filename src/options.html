<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salesforce CLI Login Helper</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #f3eadf, #f8f4ee);
        color: #1f2a37;
      }

      main {
        max-width: 760px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: #fffaf3;
        border: 1px solid #d6c7b4;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 18px 40px rgba(31, 42, 55, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      p, li {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Salesforce CLI Login Helper</h1>
        <p>This extension reads the current Salesforce page session and generates a ready-to-paste <code>sf org login access-token</code> command for your terminal.</p>
        <p>Right-click a Salesforce page, choose <code>Generate Salesforce CLI command</code>, enter your alias, and copy the command.</p>
      </section>
    </main>
  </body>
  </html>
